<!doctype html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e2b45">
<style>html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mon étude technique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Maquette « Mon étude technique » — mêmes jetons que Keren (src/styles/tokens.css).
   Mise en page : sur ordinateur, un rail de démonstration à gauche et le téléphone au centre ;
   sur téléphone, l'interface occupe tout l'écran. Keren n'a pas de thème sombre : la maquette
   s'engage volontairement sur le thème clair de la marque. */
:root {
  --navy: #0e2e49; --navy-soft: #17405f;
  --blue: #1769e8; --blue-dark: #1457c4; --blue-pale: #eef5ff; --blue-line: #d6e6fd;
  --green: #25a45a; --green-dark: #1b7d44; --green-pale: #eff9f2; --green-line: #d5ecdf;
  --ink: #14202b; --muted: #46586d; --slate: #5a6c82;
  --line: #dfe6ee; --line-soft: #e8eef5; --surface: #ffffff; --canvas: #fafbfc;
  --amber-bg: #fff5e6; --amber-line: #f2ddbb; --amber-ink: #6b4d13;
  --danger-bg: #fdf3f3; --danger-line: #f0cfcf; --danger-ink: #7d2b2b;
  --desk: #e9eef4;
  --ease: 200ms cubic-bezier(0.2, 0.7, 0.3, 1);
  --curve: cubic-bezier(0.2, 0.7, 0.3, 1);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 999px;
  --tap: 44px;
  --shadow-card: 0 1px 2px rgba(14,46,73,.05), 0 18px 42px rgba(14,46,73,.07);
  --shadow-panel: 0 18px 40px rgba(8,24,40,.12);
  --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
:focus-visible { outline: 3px solid rgba(23,105,232,.45); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; color: var(--navy); }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Bureau de démonstration ---------- */
.desk { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
.rail { background: var(--navy); color: #eaf1f8; padding: 22px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.rail__logo { width: 150px; }
.rail h2 { color: #fff; font-size: 15px; letter-spacing: .02em; }
.rail__lead { font-size: 13px; color: #b9cbe0; line-height: 1.5; }
.rail__group { display: flex; flex-direction: column; gap: 4px; }
.rail__label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: #8fa8c3; font-weight: 600; margin-bottom: 4px; }
.rail__btn { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; color: #dbe6f2; padding: 7px 10px; border-radius: 9px; font-size: 13.5px; min-height: 34px; }
.rail__btn:hover { background: rgba(255,255,255,.07); }
.rail__btn[aria-current="true"] { background: var(--blue); color: #fff; }
.rail__num { font-variant-numeric: tabular-nums; font-size: 11.5px; color: #8fa8c3; width: 18px; flex: none; }
.rail__btn[aria-current="true"] .rail__num { color: #cfe0ff; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,.08); border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: transparent; color: #cfdceb; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--navy); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: #dbe6f2; padding: 6px 2px; }
.toggle input { width: 38px; height: 22px; appearance: none; background: rgba(255,255,255,.18); border-radius: 99px; position: relative; flex: none; cursor: pointer; transition: background var(--ease); }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform var(--ease); }
.toggle input:checked { background: var(--green); }
.toggle input:checked::after { transform: translateX(16px); }
.rail__codes { font-size: 12.5px; color: #b9cbe0; background: rgba(255,255,255,.06); border-radius: 10px; padding: 10px 12px; line-height: 1.7; }
.rail__codes b { color: #fff; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.rail__reset { border: 1px solid rgba(255,255,255,.2); background: transparent; color: #fff; border-radius: 10px; padding: 9px; font-size: 13px; font-weight: 600; }

.stage { display: grid; place-items: center; padding: 24px; overflow: auto; min-width: 0; }
.phone { width: 390px; height: min(844px, calc(100vh - 48px)); background: var(--canvas); border-radius: 46px; box-shadow: 0 0 0 10px #0b1622, 0 0 0 11px #2a3a4c, 0 40px 80px rgba(8,24,40,.35); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.phone__status { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 34px; font-size: 14px; font-weight: 600; color: var(--ink); position: relative; z-index: 6; }
.phone__island { position: absolute; left: 50%; top: 10px; width: 112px; height: 30px; border-radius: 20px; background: #0b1622; transform: translateX(-50%); }
.phone__icons { display: flex; gap: 6px; align-items: center; }
.app { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
@media (max-width: 1280px) and (min-width: 761px) { .desk--crm { grid-template-columns: 220px 1fr; } .desk--crm .rail__lead, .desk--crm .rail__codes { display: none; } }
.desk--crm .stage { place-items: stretch; padding: 0; }

/* ---------- Écran d'application ---------- */
.screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; animation: in 260ms var(--curve) both; -webkit-overflow-scrolling: touch; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
.screen > * { flex-shrink: 0; } /* sur écran court, le contenu défile au lieu d'être écrasé */
.pad { padding: 0 20px; }
.topbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(250,251,252,.9); backdrop-filter: blur(12px) saturate(1.4); -webkit-backdrop-filter: blur(12px) saturate(1.4); }
.topbar__title { flex: 1; min-width: 0; font-size: 14px; color: var(--navy); font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: var(--tap); height: var(--tap); border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--navy); flex: none; }
.icon-btn:hover { background: var(--blue-pale); }
.icon-btn svg { width: 22px; height: 22px; }
.help-pill { height: 36px; padding: 0 12px; border-radius: var(--radius-pill); border: 1px solid var(--blue-line); background: var(--blue-pale); color: var(--blue-dark); font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.help-pill svg { width: 16px; height: 16px; }

.btn { min-height: 56px; width: 100%; border-radius: 14px; border: 0; font-size: 16.5px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 20px; transition: background var(--ease), transform var(--ease), box-shadow var(--ease); text-decoration: none; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn:active { transform: scale(.985); }
.btn--primary { background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(23,105,232,.28); }
.btn--primary:hover { background: var(--blue-dark); box-shadow: 0 6px 16px rgba(23,105,232,.32); }
.btn--primary[disabled] { background: #a9c6f3; box-shadow: none; cursor: not-allowed; }
.btn--soft { background: var(--blue-pale); color: var(--blue-dark); border: 1px solid var(--blue-line); }
.btn--ghost { background: var(--surface); color: var(--navy); border: 1px solid var(--line); }
.btn--green { background: var(--green); color: #fff; box-shadow: 0 2px 10px rgba(37,164,90,.3); }
.btn--sm { min-height: 46px; font-size: 15px; border-radius: 12px; }
.link-btn { border: 0; background: transparent; color: var(--blue-dark); font-weight: 600; font-size: 15px; min-height: var(--tap); padding: 0 8px; border-radius: 10px; }
.link-btn--muted { color: var(--navy); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #b6c6d8; }
.back-btn { height: var(--tap); border: 0; background: transparent; color: var(--blue-dark); font-weight: 650; font-size: 16px; display: inline-flex; align-items: center; gap: 2px; padding: 0 10px 0 4px; border-radius: 12px; flex: none; }
.back-btn svg { width: 22px; height: 22px; }
.back-btn:hover { background: var(--blue-pale); }
.alt-btns { display: grid; grid-template-columns: 1fr; gap: 8px; }
.alt-btn { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--navy); font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left; }
.alt-btn svg { width: 20px; height: 20px; color: var(--slate); flex: none; }
.alt-btn:hover { border-color: #b6d0f0; }
.step-label { padding: 10px 20px 0; font-size: 14.5px; font-weight: 650; color: var(--blue-dark); }
.demo-hint { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1.5px dashed #b6c6d8; border-radius: 12px; background: #f4f7fb; font-size: 14px; color: var(--navy); }
.demo-hint b { font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.demo-hint button { flex: none; height: 38px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--navy); color: #fff; font-weight: 650; font-size: 13.5px; }
.app.big { zoom: 1.13; }
.example__photo { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #dfe7f0; }
.credit { position: absolute; right: 10px; top: 10px; background: rgba(14,46,73,.6); color: #fff; font-size: 10.5px; padding: 2px 7px; border-radius: 99px; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.credits { font-size: 12px; color: #b9cbe0; line-height: 1.5; }
.credits a { color: #cfe0ff; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.actions { margin-top: auto; padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; background: linear-gradient(rgba(250,251,252,0), var(--canvas) 22%); position: sticky; bottom: 0; z-index: 3; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--blue); }
.muted { color: var(--muted); }
.small { font-size: 14.5px; }

/* Keren — petite phrase d'accompagnement, sans gros avatar */
.keren { display: flex; gap: 10px; align-items: flex-start; }
.keren__k { width: 28px; height: 28px; border-radius: 50%; background: #1f6fe0; color: #fff; font-weight: 600; font-size: 14px; display: grid; place-items: center; flex: none; margin-top: 1px; }
.keren__txt { background: var(--surface); border: 1px solid #e4eaf1; border-radius: 16px 16px 16px 6px; padding: 10px 14px; font-size: 15px; line-height: 1.5; color: var(--ink); }

/* ---------- Accueil ---------- */
.hero { position: relative; height: 250px; flex: none; background-size: cover; background-position: 70% 50%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,46,73,.05) 30%, var(--canvas) 98%); }
.hero__logo { position: absolute; left: 16px; top: 8px; width: 132px; z-index: 2; filter: drop-shadow(0 2px 8px rgba(255,255,255,.7)); }
.welcome { padding: 0 22px 8px; margin-top: -54px; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 14px; }
.welcome h1 { font-size: clamp(24px, 7.6vw, 31px); line-height: 1.15; letter-spacing: -.02em; font-weight: 750; }
.welcome__sub { font-size: 17px; font-weight: 600; color: var(--blue-dark); line-height: 1.4; }
.welcome__txt { font-size: 15.5px; color: var(--muted); }
.perks { display: grid; gap: 8px; margin-top: 4px; }
.perk { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; }
.perk__ic { width: 40px; height: 40px; border-radius: 50%; background: var(--green-pale); color: var(--green-dark); display: grid; place-items: center; flex: none; }
.perk__ic svg { width: 20px; height: 20px; }
.perk b { display: block; font-size: 15px; color: var(--navy); font-weight: 650; }
.perk span { font-size: 13.5px; color: var(--muted); }
.privacy { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 12.5px; color: var(--slate); }
.privacy svg { width: 14px; height: 14px; }

/* ---------- Formulaires ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--navy); }
.input { height: 58px; border: 1.5px solid #b6d0f0; border-radius: 14px; padding: 0 16px; font-size: 19px; background: var(--surface); width: 100%; transition: border-color var(--ease), box-shadow var(--ease); }
.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23,105,232,.16); }
.input--code { font-variant-numeric: tabular-nums; letter-spacing: .12em; text-transform: uppercase; font-weight: 650; text-align: center; font-size: 21px; }
.input--error { border-color: #d98c8c; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: #edf2f7; border-radius: 14px; padding: 4px; }
.tabs button { min-height: 46px; border: 0; background: transparent; border-radius: 11px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; justify-content: center; font-size: 15px; }
.tabs button svg { width: 18px; height: 18px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--navy); box-shadow: 0 1px 4px rgba(14,46,73,.12); }
.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.note--info { background: var(--blue-pale); color: var(--navy); }
.note--warn { background: var(--amber-bg); color: var(--amber-ink); border: 1px solid var(--amber-line); }
.note--error { background: var(--danger-bg); color: var(--danger-ink); border: 1px solid var(--danger-line); }
.note--ok { background: var(--green-pale); color: var(--green-dark); border: 1px solid var(--green-line); }

/* OTP : un seul champ réel (collage, autoremplissage), six cases visuelles */
.otp { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.otp__box { height: 62px; border: 1.5px solid #b6d0f0; border-radius: 14px; background: var(--surface); display: grid; place-items: center; font-size: 26px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; transition: border-color var(--ease), box-shadow var(--ease); }
.otp__box--active { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23,105,232,.16); }
.otp__box--active:empty::after { content: ""; width: 2px; height: 26px; background: var(--blue); animation: blink 1s steps(1) infinite; }
.otp--error .otp__box { border-color: #d98c8c; animation: shake 320ms; }
.otp--ok .otp__box { border-color: var(--green); background: var(--green-pale); }
.otp__input { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; letter-spacing: 3em; caret-color: transparent; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.timer { font-variant-numeric: tabular-nums; }
.channel-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: var(--green-pale); color: var(--green-dark); font-size: 13px; font-weight: 600; }
.channel-chip svg { width: 15px; height: 15px; }

/* Notification simulée (démo) */
.notif { position: absolute; left: 10px; right: 10px; top: 6px; z-index: 30; background: rgba(245,247,250,.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 20px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(8,24,40,.22); display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 0; width: auto; animation: drop 380ms var(--curve) both; }
@keyframes drop { from { transform: translateY(-120%); } }
.notif__ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.notif__ic svg { width: 20px; height: 20px; }
.notif b { font-size: 13.5px; display: block; }
.notif span { font-size: 13.5px; color: #34404d; line-height: 1.35; display: block; }
.notif small { font-size: 11.5px; color: var(--slate); }

/* ---------- Projet / bienvenue ---------- */
.project { padding: 14px 16px; display: grid; gap: 2px; }
.project__row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 15px; }
.project__row:last-child { border-bottom: 0; }
.project__row span { color: var(--muted); }
.project__row b { color: var(--navy); font-weight: 600; text-align: right; }
.source { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--green-dark); font-weight: 600; }
.source svg { width: 14px; height: 14px; }

/* ---------- Hub / progression ---------- */
.ring { width: 96px; height: 96px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring__val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 22px; font-weight: 750; color: var(--navy); font-variant-numeric: tabular-nums; }
.ring circle { transition: stroke-dashoffset 700ms var(--curve); }
.summary { display: flex; gap: 16px; align-items: center; padding: 16px; }
.summary h2 { font-size: 18px; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; text-align: left; width: 100%; min-height: 68px; transition: border-color var(--ease), transform var(--ease); }
.step:hover { border-color: #b6d0f0; }
.step__ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--blue-pale); color: var(--blue); }
.step__ic svg { width: 21px; height: 21px; }
.step--done .step__ic { background: var(--green-pale); color: var(--green-dark); }
.step--current { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23,105,232,.1); }
.step__body { flex: 1; min-width: 0; }
.step__body b { display: block; font-size: 15.5px; color: var(--navy); font-weight: 650; }
.step__body span { font-size: 13px; color: var(--muted); }
.step__state { flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill svg { width: 13px; height: 13px; }
.pill--done { background: var(--green-pale); color: var(--green-dark); }
.pill--todo { background: #f1f4f8; color: var(--muted); }
.pill--current { background: var(--blue-pale); color: var(--blue-dark); }
.pill--warn { background: var(--amber-bg); color: var(--amber-ink); }
.pill--info { background: #e9f6f6; color: #17686b; }

/* Barre de progression en segments */
.progress { display: flex; gap: 4px; padding: 0 20px; }
.progress span { flex: 1; height: 5px; border-radius: 99px; background: #dde6f0; overflow: hidden; position: relative; }
.progress span i { position: absolute; inset: 0; background: var(--blue); transform-origin: left; transition: transform 500ms var(--curve); }
.progress span.done i { background: var(--green); }

/* ---------- Écran photo ---------- */
.shot-head { padding: 6px 20px 0; display: flex; flex-direction: column; gap: 8px; }
.shot-head h1 { font-size: clamp(22px, 6.8vw, 28px); line-height: 1.2; letter-spacing: -.015em; font-weight: 750; }
.shot-head p { font-size: 17.5px; color: var(--ink); line-height: 1.5; }
.example { margin: 14px 20px 0; position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--blue-pale); }
.example svg { display: block; width: 100%; height: auto; }
.example__tag { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.94); color: var(--navy); font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; letter-spacing: .02em; }
.example__more { position: absolute; right: 10px; bottom: 10px; background: rgba(255,255,255,.94); border: 0; color: var(--blue-dark); font-size: 12.5px; font-weight: 650; padding: 6px 10px; border-radius: 99px; }
.tips { margin: 12px 20px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--navy); }
.tip svg { width: 14px; height: 14px; color: var(--green-dark); }
.alt-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px 6px; }
.safety { margin: 12px 20px 0; }
.thumbs { display: flex; gap: 8px; margin: 12px 20px 0; flex-wrap: wrap; }
.thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 2px solid var(--green); }

/* Appareil photo simulé */
.cam { flex: 1; background: #05090e; display: flex; flex-direction: column; color: #fff; position: relative; min-height: 0; }
.cam__view { flex: 1; position: relative; overflow: hidden; }
.cam__view img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.9) contrast(1.05); animation: sway 6s ease-in-out infinite alternate; }
@keyframes sway { to { transform: scale(1.04) translate(-6px, 4px); } }
.cam__guide { position: absolute; inset: 14% 9% 18%; border-radius: 18px; }
.cam__guide i { position: absolute; width: 34px; height: 34px; border: 3px solid #fff; }
.cam__guide i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
.cam__guide i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
.cam__guide i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
.cam__guide i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
.cam__hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 99px; font-size: 14px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.cam__bar { height: 150px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 28px 16px; }
.shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 4px; }
.shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform 120ms; }
.shutter:active span { transform: scale(.9); }
.cam__side { border: 0; background: rgba(255,255,255,.14); color: #fff; height: 44px; border-radius: 22px; padding: 0 14px; font-size: 14px; font-weight: 600; justify-self: start; }
.cam__flash { position: absolute; inset: 0; background: #fff; animation: flash 260ms ease-out both; pointer-events: none; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }
.cam__native { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: rgba(255,255,255,.75); white-space: nowrap; }

/* Aperçu */
.preview { margin: 8px 20px 0; border-radius: 18px; overflow: hidden; position: relative; background: #0b1622; aspect-ratio: 4/3; max-width: 100%; }
.preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.checks { margin: 12px 20px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.upload { margin: 12px 20px 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.upload__bar { height: 8px; border-radius: 99px; background: #e3ebf4; overflow: hidden; }
.upload__bar i { display: block; height: 100%; background: var(--blue); width: 0; transition: width 240ms linear; border-radius: 99px; }
.upload__row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; gap: 8px; }
.saved { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 18px 20px 4px; }
.tick { width: 74px; height: 74px; border-radius: 50%; background: var(--green-pale); display: grid; place-items: center; }
.tick svg { width: 40px; height: 40px; color: var(--green); }
.tick path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw 520ms 120ms var(--curve) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.pop { animation: pop 420ms var(--curve) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); } }

/* Feuilles (bottom sheets) */
.scrim { position: absolute; inset: 0; background: rgba(8,22,36,.45); z-index: 20; animation: fade 200ms both; display: flex; align-items: flex-end; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px)); animation: up 300ms var(--curve) both; display: flex; flex-direction: column; gap: 12px; }
@keyframes up { from { transform: translateY(100%); } }
.sheet__grip { width: 40px; height: 5px; border-radius: 99px; background: #d6dee8; align-self: center; margin-bottom: 4px; }
.sheet h2 { font-size: 20px; }
.option { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 10px 14px; text-align: left; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 15.5px; font-weight: 550; color: var(--navy); transition: border-color var(--ease), background var(--ease); }
.option:hover { border-color: #b6d0f0; }
.option[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-pale); }
.option__ic { width: 36px; height: 36px; border-radius: 10px; background: var(--blue-pale); color: var(--blue); display: grid; place-items: center; flex: none; }
.option__ic svg { width: 19px; height: 19px; }
.option small { display: block; font-weight: 450; color: var(--muted); font-size: 13px; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--navy); }
.slot[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: #fff; }
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.day { flex: none; width: 62px; min-height: 64px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12.5px; color: var(--muted); }
.day b { font-size: 18px; color: var(--navy); }
.day[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-pale); }
.textarea { min-height: 96px; border: 1.5px solid #b6d0f0; border-radius: 14px; padding: 12px 14px; font-size: 16px; resize: vertical; width: 100%; }
.textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23,105,232,.16); }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--ink); line-height: 1.45; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--blue); flex: none; margin: 1px 0 0; }

/* Résumé / fin / suivi */
.recap { display: flex; flex-direction: column; }
.recap__row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.recap__row:last-child { border-bottom: 0; }
.recap__thumbs { display: flex; }
.recap__thumbs img, .recap__thumbs span { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 2px solid var(--surface); margin-left: -8px; background: var(--blue-pale); }
.recap__thumbs :first-child { margin-left: 0; }
.missing { font-size: 13.5px; color: var(--amber-ink); }
.ref { font-variant-numeric: tabular-nums; letter-spacing: .04em; font-weight: 700; color: var(--navy); }
.success { padding: 24px 22px 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.success h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.015em; }
.burst { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
.burst::before, .burst::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--green-line); animation: ripple 2.4s ease-out infinite; }
.burst::after { animation-delay: 1.2s; }
@keyframes ripple { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
.burst .tick { width: 92px; height: 92px; background: var(--green); }
.burst .tick svg { color: #fff; width: 48px; height: 48px; }
.timeline { display: flex; flex-direction: column; padding: 4px 0; }
.tl { display: grid; grid-template-columns: 30px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: 14px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl--done::before { background: var(--green); }
.tl__dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--slate); font-size: 13px; font-weight: 700; position: relative; z-index: 1; }
.tl__dot svg { width: 16px; height: 16px; }
.tl--done .tl__dot { background: var(--green); border-color: var(--green); color: #fff; }
.tl--current .tl__dot { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 4px rgba(23,105,232,.12); }
.tl--warn .tl__dot { border-color: #e3a93c; color: #b7791f; background: var(--amber-bg); }
.tl b { display: block; color: var(--navy); font-size: 15.5px; }
.tl span { font-size: 13.5px; color: var(--muted); }
.tl--todo b { color: var(--slate); font-weight: 550; }
.request { border: 1.5px solid var(--amber-line); background: var(--amber-bg); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.request__msg { background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--ink); border: 1px solid var(--amber-line); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 24px; z-index: 40; background: var(--navy); color: #fff; border-radius: 14px; padding: 13px 16px; font-size: 14.5px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-panel); animation: up 260ms var(--curve) both; }
.toast svg { width: 18px; height: 18px; color: #7fe0a6; flex: none; }
.netbar { background: var(--amber-bg); color: var(--amber-ink); font-size: 13px; padding: 8px 16px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--amber-line); }
.netbar svg { width: 16px; height: 16px; flex: none; }
.menu-list { display: flex; flex-direction: column; gap: 6px; }

/* ---------- CRM ---------- */
.crm { flex: 1; display: grid; grid-template-columns: minmax(260px, 320px) 1fr; min-height: 0; background: var(--canvas); height: 100%; }
.crm__top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 22px; background: var(--surface); border-bottom: 1px solid var(--line); }
.crm__top img { height: 34px; }
.crm__nav { display: flex; gap: 4px; }
.crm__nav span { padding: 7px 12px; border-radius: 9px; font-size: 14px; color: var(--muted); font-weight: 550; }
.crm__nav span.on { background: var(--blue-pale); color: var(--blue-dark); }
.crm__user { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.crm__avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.crm__list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); min-height: 0; }
.crm__kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-soft); border-bottom: 1px solid var(--line); }
.kpi { background: var(--surface); padding: 12px 14px; }
.kpi b { display: block; font-size: 22px; color: var(--navy); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.crm__search { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.crm__search input { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line); padding: 0 12px; font-size: 14px; background: var(--canvas); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); text-align: left; width: 100%; border-left: 3px solid transparent; background: transparent; border-top: 0; border-right: 0; }
.row:hover { background: #f6f9fc; }
.row[aria-current="true"] { background: var(--blue-pale); border-left-color: var(--blue); }
.row b { font-size: 14.5px; color: var(--navy); min-width: 0; }
.row .pill { justify-self: end; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.row small { font-size: 12.5px; color: var(--muted); }
.row .mini { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.mini__bar { flex: 1; height: 5px; border-radius: 99px; background: #e3ebf4; overflow: hidden; }
.mini__bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
.mini span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 42px; text-align: right; white-space: nowrap; }
.crm__detail { overflow-y: auto; padding: 20px 24px 40px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.crm__head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.crm__head h2 { font-size: 22px; }
.crm__head .grow { flex: 1; min-width: 220px; }
.crm__btns { display: flex; gap: 8px; flex-wrap: wrap; }
.cbtn { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--navy); display: inline-flex; align-items: center; gap: 7px; }
.cbtn svg { width: 16px; height: 16px; }
.cbtn:hover { border-color: #b9c8d8; }
.cbtn--primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.cbtn--primary:hover { background: var(--blue-dark); }
.cbtn--danger { color: var(--danger-ink); }
.crm__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--slate); font-weight: 700; }
.codebox { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--canvas); border: 1px dashed #b6d0f0; border-radius: 10px; padding: 10px 12px; }
.codebox { flex-wrap: wrap; }
.codebox b { white-space: nowrap; font-size: 18px; letter-spacing: .08em; color: var(--navy); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 13.5px; }
.kv span { color: var(--muted); }
.kv b { color: var(--navy); font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.kv b .pill { white-space: normal; }
.cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-tabs button { height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.cat-tabs button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.cat-tabs em { font-style: normal; font-variant-numeric: tabular-nums; opacity: .75; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.ph { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; }
.ph__img { aspect-ratio: 4/3; background: var(--blue-pale); position: relative; }
.ph__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph__img .pill { position: absolute; left: 8px; top: 8px; }
.ph__empty { display: grid; place-items: center; height: 100%; padding: 10px; text-align: center; font-size: 12.5px; color: var(--muted); }
.ph__body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.ph__body b { font-size: 13.5px; color: var(--navy); }
.ph__body small { font-size: 12px; color: var(--muted); }
.ph__acts { display: flex; gap: 6px; }
.ph__acts .cbtn { height: 32px; padding: 0 10px; font-size: 12.5px; flex: 1; justify-content: center; }
.log { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.log div { display: grid; grid-template-columns: 92px 1fr; gap: 10px; }
.log time { color: var(--slate); font-variant-numeric: tabular-nums; }
.crm-modal { position: fixed; inset: 0; background: rgba(8,22,36,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.crm-modal .panel { width: min(460px, 100%); box-shadow: var(--shadow-panel); padding: 22px; }

/* Démo sur téléphone : le rail devient une feuille */
.demo-fab { display: none; }
/* Mode téléphone : toute largeur jusqu'à 760 px, et tout téléphone tenu en paysage. */
@media (max-width: 760px), (max-height: 540px) and (pointer: coarse) {
  html, body { overflow: hidden; overscroll-behavior: none; }
  body { background: var(--canvas); }
  .desk { display: block; height: calc(var(--vvh, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); transform: translateY(var(--vvt, 0px)); }
  .app { width: 100%; max-width: 620px; margin: 0 auto; }
  .crm__search input { font-size: 16px; }
  .rail { position: fixed; inset: auto 0 0 0; max-height: 82%; z-index: 100; border-radius: 22px 22px 0 0; transform: translateY(105%); transition: transform 300ms var(--curve); box-shadow: 0 -10px 40px rgba(0,0,0,.3); padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  .rail.open { transform: none; }
  .stage { padding: 0; height: 100%; display: block; }
  .phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  .phone__status { display: none; }
  .demo-fab { display: flex; position: fixed; right: 0; top: 34%; z-index: 90; writing-mode: vertical-rl; width: 26px; padding: 12px 0; letter-spacing: .06em; border-radius: 10px 0 0 10px; border: 0; background: var(--navy); color: #fff; font-size: 13px; font-weight: 650; align-items: center; gap: 6px; box-shadow: 0 6px 18px rgba(8,24,40,.3); opacity: .92; }
  .demo-fab svg { display: none; }
  .crm { grid-template-columns: 1fr; height: auto; min-height: 100%; }
  .crm__list { max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .crm__nav { display: none; }
  .crm__detail { padding: 16px; }
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .pill { grid-row: 1; grid-column: 2; font-size: 11px; padding: 3px 8px; white-space: normal; text-align: right; }
  .notif { top: calc(6px + env(safe-area-inset-top, 0px)); }
}
/* Petits écrans : iPhone SE 1re génération, Android d'entrée de gamme, écran externe des pliables */
@media (max-width: 359px) {
  .pad, .welcome { padding-left: 16px; padding-right: 16px; }
  .shot-head, .progress, .step-label { padding-left: 16px; padding-right: 16px; }
  .example, .tips, .safety, .thumbs, .preview, .checks, .upload { margin-left: 16px; margin-right: 16px; }
  .actions { padding-left: 16px; padding-right: 16px; }
  .otp { gap: 6px; } .otp__box { height: 54px; font-size: 23px; border-radius: 12px; }
  .tabs button { font-size: 14px; gap: 6px; } .tabs button svg { display: none; }
  .btn { font-size: 16px; padding: 0 14px; }
  .help-pill { padding: 0 10px; font-size: 13px; } .help-pill svg { display: none; }
  .back-btn { font-size: 15px; padding-right: 6px; }
  .summary { gap: 12px; padding: 14px; } .summary .ring { width: 80px !important; height: 80px !important; }
  .perk { padding: 9px 10px; } .perk__ic { width: 36px; height: 36px; }
  .slots { grid-template-columns: repeat(2, 1fr); }
  .input--code { font-size: 19px; letter-spacing: .08em; }
}
/* Écrans peu hauts : iPhone SE, téléphones en paysage, clavier ouvert */
@media (max-height: 700px) {
  .hero { height: 180px; }
  .welcome { margin-top: -40px; gap: 10px; }
  .perks { gap: 6px; }
  .example__photo, .example svg { max-height: 30vh; object-fit: cover; }
  .actions { padding-top: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
  .btn { min-height: 52px; }
  .alt-btn { min-height: 48px; }
}
@media (max-height: 540px) and (pointer: coarse) {
  .hero { height: 120px; }
  .home__hero { min-height: 120px; }
  .home__body h1 { font-size: 26px; }
  .home__body p { font-size: 16px; }
  .actions .btn { font-size: 15.5px; white-space: nowrap; }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: center; padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .actions > * { min-width: 0; }
  .actions .btn { min-height: 48px; }
  .actions .privacy { grid-column: 1 / -1; }
  .cam__bar { height: 104px; }
  .success { padding-top: 16px !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

/* ================= Parcours V2 : épuré ================= */
.h-xl { font-size: clamp(25px, 7.2vw, 30px); line-height: 1.15; letter-spacing: -.02em; font-weight: 750; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
/* Accueil */
.screen--home { background: var(--surface); }
.home__hero { position: relative; flex: 1 1 auto !important; min-height: 240px; background-size: cover; background-position: 72% 50%; }
.home__hero::after { content: ""; position: absolute; inset: 0 0 -2px; background: linear-gradient(180deg, rgba(255,255,255,0) 45%, var(--surface) 96%); }
.home__logo { position: absolute; left: 18px; top: 14px; width: 128px; z-index: 2; filter: drop-shadow(0 2px 10px rgba(255,255,255,.8)); }
.home__body { padding: 0 24px 4px; display: flex; flex-direction: column; gap: 8px; margin-top: -8px; position: relative; z-index: 2; }
.home__body h1 { font-size: clamp(30px, 8.6vw, 36px); line-height: 1.08; letter-spacing: -.025em; font-weight: 780; }
.home__body p { font-size: 18px; color: var(--muted); }
.screen--home .actions { background: var(--surface); }
/* Bienvenue */
.hello { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.hello h1 { font-size: clamp(30px, 8.6vw, 36px); line-height: 1.1; letter-spacing: -.025em; font-weight: 780; }
.hello__sub { font-size: 18px; color: var(--muted); }
.road { list-style: none; margin: 14px 0 6px; padding: 0; display: flex; flex-direction: column; gap: 0; }
.road li { display: flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 600; color: var(--navy); padding: 9px 0; position: relative; }
.road li:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 50px; height: 14px; width: 2px; background: var(--line); }
.road__ic { width: 44px; height: 44px; border-radius: 14px; background: var(--blue-pale); color: var(--blue); display: grid; place-items: center; flex: none; }
.road__ic svg { width: 21px; height: 21px; }
.hello__note { display: flex; gap: 8px; align-items: center; font-size: 14.5px; color: var(--slate); margin-top: 8px; }
.hello__note svg { width: 16px; height: 16px; flex: none; }
/* Barre de parcours : discrète */
.flowbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: rgba(250,251,252,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.flowbar .back-btn { padding-right: 8px; }
.flowbar__mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.flowbar__label { font-size: 13px; font-weight: 600; color: var(--slate); }
.flowbar__track { width: 100%; max-width: 180px; height: 4px; border-radius: 99px; background: #e2e9f1; overflow: hidden; }
.flowbar__track i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width 500ms var(--curve); }
.sr-sm { }
@media (max-width: 359px) { .sr-sm { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
/* Demande unique */
.flow { padding: 14px 20px 8px; display: flex; flex-direction: column; gap: 10px; }
.flow__title { font-size: clamp(26px, 7.6vw, 32px); line-height: 1.12; letter-spacing: -.02em; font-weight: 760; }
.flow__sub { font-size: 18px; color: var(--muted); line-height: 1.45; }
.flow__request { display: flex; gap: 8px; align-items: center; font-size: 14.5px; color: var(--amber-ink); background: var(--amber-bg); border-radius: 12px; padding: 9px 12px; }
.flow__request svg { width: 16px; height: 16px; flex: none; }
.ex { margin: 8px 0 0; position: relative; border-radius: 22px; overflow: hidden; background: #e7edf4; box-shadow: 0 1px 2px rgba(14,46,73,.06), 0 14px 34px rgba(14,46,73,.10); }
.ex img, .ex svg { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.ex__tag { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.95); color: var(--navy); font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 99px; }
.ex__credit { position: absolute; right: 10px; bottom: 8px; color: rgba(255,255,255,.92); font-size: 10.5px; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why { display: flex; gap: 8px; align-items: center; min-height: 44px; text-align: left; border: 0; background: transparent; padding: 4px 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.why svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--green-dark); }
.why u { color: var(--navy); text-underline-offset: 3px; text-decoration-color: #b6c6d8; }
.links { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 4px; }
.links .link-btn { display: inline-flex; align-items: center; gap: 6px; }
.links .link-btn svg { width: 17px; height: 17px; }
.link-btn--quiet { color: var(--slate); font-weight: 550; }
/* Pages / photos déjà enregistrées */
.pages { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.pages__item { position: relative; width: 84px; height: 84px; border-radius: 14px; overflow: hidden; background: var(--blue-pale); }
.pages__item img { width: 100%; height: 100%; object-fit: cover; }
.pages__item i { position: absolute; right: 5px; bottom: 5px; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; }
.pages__item i svg { width: 13px; height: 13px; }
.pages__label { font-size: 15px; font-weight: 600; color: var(--green-dark); }
.thumb-pdf { width: 100%; height: 100%; display: grid; place-items: center; align-content: center; gap: 2px; color: var(--blue); background: var(--blue-pale); }
.thumb-pdf svg { width: 26px; height: 26px; }
.thumb-pdf small { font-size: 11px; font-weight: 700; }
.thumb-pdf--big svg { width: 54px; height: 54px; }
.thumb-pdf--big small { font-size: 14px; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Photo enregistrée */
.saved { align-items: center; text-align: center; gap: 16px; padding-top: 22px; }
.saved__img { position: relative; width: min(78%, 300px); aspect-ratio: 4 / 3; border-radius: 22px; overflow: visible; }
.saved__img img, .saved__img .thumb-pdf { width: 100%; height: 100%; object-fit: cover; border-radius: 22px; box-shadow: 0 14px 34px rgba(14,46,73,.14); }
.saved__badge { position: absolute; right: -12px; bottom: -12px; width: 56px; height: 56px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(14,46,73,.16); }
.saved__img.is-ok .saved__badge { background: var(--green); color: #fff; animation: pop 420ms var(--curve) both; }
.saved__badge svg { width: 28px; height: 28px; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #d6e3f3; border-top-color: var(--blue); animation: rot .8s linear infinite; display: block; }
@keyframes rot { to { transform: rotate(360deg); } }
.saved .upload__bar { width: min(70%, 260px); }
/* Photo d'exemple qui s'adapte à la hauteur visible : photo et bouton tiennent ensemble à l'écran */
.ex--fit img { max-height: max(150px, calc(var(--vvh, 100dvh) - 410px)); }
/* Choix (question radiateurs) */
.choice { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--surface); font-size: 17.5px; font-weight: 650; color: var(--navy); text-align: left; transition: border-color var(--ease), background var(--ease); }
.choice > svg { width: 20px; height: 20px; margin-left: auto; color: var(--slate); flex: none; }
.choice:hover, .choice[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-pale); }
.choice__ic { width: 46px; height: 46px; border-radius: 14px; background: var(--blue-pale); color: var(--blue); display: grid; place-items: center; flex: none; }
.choice__ic svg { width: 22px; height: 22px; }
/* Mon étude */
.hubhead { display: flex; gap: 16px; align-items: center; padding: 6px 2px 4px; }
.hubhead h2 { font-size: 21px; }
.step__ok { width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }
.step__ok svg { width: 16px; height: 16px; }
/* Envoi */
.recap2 { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; }
.recap2__row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; text-align: left; width: 100%; min-height: 64px; }
.recap2__row:last-child { border-bottom: 0; }
.recap2__row b { flex: 1; min-width: 0; font-size: 16.5px; color: var(--navy); }
.recap2__ic { width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }
.recap2__ic svg { width: 16px; height: 16px; }
.recap2__ic.is-miss { background: var(--amber-bg); color: #b7791f; }
.recap2__thumbs { display: flex; }
.recap2__thumbs img, .recap2__thumbs .thumb-pdf { width: 36px; height: 36px; border-radius: 9px; object-fit: cover; border: 2px solid var(--surface); margin-left: -10px; }
.recap2__thumbs > :first-child { margin-left: 0; }
.recap2__thumbs .thumb-pdf svg { width: 16px; height: 16px; } .recap2__thumbs .thumb-pdf small { display: none; }
.inline-link { border: 0; background: none; padding: 9px 0; margin: -9px 0; display: inline-block; color: var(--blue-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
/* Feuilles */
.sheet__txt { font-size: 16.5px; color: var(--ink); line-height: 1.5; }
.info-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.info-list li { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; line-height: 1.45; }
.info-list svg { width: 20px; height: 20px; flex: none; color: var(--green-dark); margin-top: 1px; }
/* CRM */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .cbtn[disabled] { opacity: .5; cursor: default; }
.toggle--light { color: var(--navy); font-size: 14px; }
.toggle--light input { background: #d6dee8; }
</style>

/* Photos dans IndexedDB, état dans localStorage. Une photo en cours d'envoi est gardée :
   si l'onglet se ferme, l'envoi reprend au retour. */
const IDB = (() => {
  let db = null;
  const open = () => new Promise(res => { try { const r = indexedDB.open('aeh-etude-demo-v2', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { db = r.result; res(db); }; r.onerror = () => res(null); } catch { res(null); } });
  const tx = (mode, fn) => new Promise(res => { if (!db) return res(null); try { const t = db.transaction('kv', mode); const r = fn(t.objectStore('kv')); t.oncomplete = () => res(r?.result ?? true); t.onerror = () => res(null); } catch { res(null); } });
  return {
    open,
    put: (k, v) => tx('readwrite', st => st.put(v, k)),
    del: k => tx('readwrite', st => st.delete(k)),
    clear: () => tx('readwrite', st => st.clear()),
    all: () => new Promise(res => { if (!db) return res({}); try { const out = {}; const r = db.transaction('kv').objectStore('kv').openCursor(); r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); }; r.onerror = () => res(out); } catch { res({}); } })
  };
})();

let PENDING = null;
let UPL = null;
let CAMSHOT = null;
function synthPhoto(kind) {
  return new Promise(res => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="1280" height="800">${(ILL[kind] || ILL.chaudiere)().replace(/stroke="#25a45a"[^>]*stroke-dasharray="9 7"/g, 'stroke="none"')}</svg>`;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = 1280; c.height = 960; const x = c.getContext('2d');
      x.fillStyle = '#ece7de'; x.fillRect(0, 0, 1280, 960);
      x.drawImage(img, -40 + Math.random() * 30, 60 + Math.random() * 30, 1360, 850);
      const g = x.createRadialGradient(640, 480, 200, 640, 480, 900); g.addColorStop(0, 'rgba(255,240,215,0.06)'); g.addColorStop(1, 'rgba(30,25,15,0.32)'); x.fillStyle = g; x.fillRect(0, 0, 1280, 960);
      res({ src: c.toDataURL('image/jpeg', .72), kb: 310 + Math.random() * 180, origKb: 3400 + Math.random() * 1600 });
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
// Démo : « prendre » la photo d'exemple, légèrement recadrée (chaque prise est différente).
function synthFor(id) {

  { id: 'paul', name: 'Paul Lefèvre', city: 'Roanne (42)', pct: 100, st: 'analyse', last: 'Hier 18:20', conseiller: 'Inès B.' },
  { id: 'nadia', name: 'Nadia Benali', city: 'Montbrison (42)', pct: 46, st: 'a_completer', last: 'Il y a 3 j', conseiller: 'Thomas R.' },
  { id: 'jm', name: 'Jean-Marc Roux', city: 'Firminy (42)', pct: 100, st: 'complement', last: '10/10', conseiller: 'Inès B.' },
  { id: 'claire', name: 'Claire Morel', city: 'Saint-Chamond (42)', pct: 100, st: 'termine', last: '08/10', conseiller: 'Thomas R.' },
  { id: 'ahmed', name: 'Ahmed Haddad', city: 'Rive-de-Gier (42)', pct: 0, st: 'invite', last: 'Jamais', conseiller: 'Inès B.' }
];
const ST_LABEL = { a_completer: ['Étude à compléter', 'pill--current'], transmis: ['Photos transmises', 'pill--info'], analyse: ['Analyse en cours', 'pill--info'], complement: ['Complément demandé', 'pill--warn'], termine: ['Étude terminée', 'pill--done'], invite: ['Invitation envoyée', 'pill--todo'] };
const CRM_CATS = [...STEPS.map(s => [s.cat, s.id]), ['Compléments', 'extra']];
function crmView() {
  const sel = DOSSIERS.find(d => d.id === S.crmSel) || DOSSIERS[0];
  const p = progress();
  const rows = DOSSIERS.map(d => { const me = d.id === 'martine'; const pct = me ? p.pct : d.pct; const st = me ? S.status : d.st; const last = me ? (S.auth?.at || 'Jamais') : d.last; return `<button class="row" data-crm="sel" data-v="${d.id}" aria-current="${d.id === sel.id}"><b>${esc(d.name)}</b><span class="pill ${ST_LABEL[st][1]}" style="font-size:11.5px">${ST_LABEL[st][0]}</span><small>${esc(d.city)} · ${esc(last)}</small><small style="text-align:right">${esc(d.conseiller)}</small><div class="mini"><div class="mini__bar"><i style="width:${pct}%;${pct >= 100 ? 'background:var(--green)' : ''}"></i></div><span>${pct} %</span></div></button>`; }).join('');
  return `<div class="crm">
    <div class="crm__top"><img src="${ASSET.keren}" alt="Keren"><nav class="crm__nav"><span>Prospects</span><span>Clients</span><span class="on">Études techniques</span><span>Agenda</span></nav><span class="crm__user"><span class="crm__avatar">SM</span>Sarah M. · Service technique</span></div>
    <aside class="crm__list">
      <div class="crm__kpis"><div class="kpi"><b>6</b><span>Études ouvertes</span></div><div class="kpi"><b>2</b><span>À analyser</span></div><div class="kpi"><b>1</b><span>Complément</span></div></div>
      <div class="crm__search"><input placeholder="Rechercher un client, une ville, une référence" aria-label="Rechercher"></div>
      ${rows}
    </aside>
    <section class="crm__detail">${sel.id === 'martine' ? crmMartine() : `<div class="crm__head"><div class="grow"><span class="eyebrow">Dossier fictif</span><h2>${esc(sel.name)}</h2><p class="muted small">${esc(sel.city)} · Conseiller ${esc(sel.conseiller)}</p></div></div><div class="panel"><p class="muted">Dans cette démonstration, seul le dossier de <b>Martine Dubois</b> est relié à l’espace client.</p><button class="cbtn cbtn--primary" data-crm="sel" data-v="martine" style="align-self:flex-start">Ouvrir le dossier de Martine Dubois</button></div>`}</section>
  </div>`;
}
function crmMartine() {
  const p = progress();
  const [catName, catId] = CRM_CATS.find(c => c[0] === S.crmCat) || CRM_CATS[0];
  const list = catId === 'extra' ? SHOTS.filter(s => s.extra && (S.shots[s.id] || S.complement.includes(s.id))) : stepShots(catId);
  const missing = applicable().filter(s => !isAnswered(s.id) || S.shots[s.id]?.status === 'cant');
  const cells = list.map(s => {
    const r = S.shots[s.id];
    if (!r || r.status !== 'done') return `<div class="ph"><div class="ph__img"><div class="ph__empty">${S.complement.includes(s.id) ? 'Demandé à la cliente' : !r ? 'En attente' : r.status === 'na' ? (r.reason === 'identiques' ? 'Radiateurs tous identiques' : r.reason === 'absent' ? 'Pas de ballon' : 'Non concerné') : `Pas de photo : ${esc(CANT.find(c => c[0] === r.reason)?.[1].toLowerCase() || '')}`}</div></div><div class="ph__body"><b>${esc(s.title)}</b></div></div>`;
    return r.photos.map((ph, i) => `<div class="ph"><div class="ph__img">${ph.src ? `<img src="${ph.src}" alt="${esc(s.title)}">` : `<div class="ph__empty">${ph.pdf ? 'PDF' : 'Photo'}</div>`}${S.complement.includes(s.id) ? `<span class="pill pill--warn">Nouvelle photo demandée</span>` : r.crm === 'ok' ? `<span class="pill pill--done">${ic('check', 2.6)}Validée</span>` : r.crm === 'new' ? `<span class="pill pill--current">Nouvelle</span>` : ''}</div>
      <div class="ph__body"><b>${esc(s.title)}${r.photos.length > 1 ? ` · ${s.doc ? 'page' : 'photo'} ${i + 1}` : ''}</b><small>${Math.round(ph.kb || 400)} Ko · reçue ${esc(ph.at || '')}</small>
      <div class="ph__acts"><button class="cbtn" data-crm="ok" data-v="${s.id}">${ic('check', 2.4)}Valider</button><button class="cbtn" data-crm="redo" data-v="${s.id}">${ic('refresh')}Redemander</button></div></div></div>`).join('');
  }).join('');
  return `<div class="crm__head"><div class="grow"><span class="eyebrow">Étude technique · ${S.ref}</span><h2>Martine Dubois</h2><p class="muted small">Maison 1978 · 118 m² · Saint-Étienne (42) · Conseiller Thomas R.</p></div>
    <div class="crm__btns"><select class="cbtn" data-crm="status" aria-label="Statut du dossier">${STATUSES.map(s => `<option value="${s[0]}" ${S.status === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}</select><button class="cbtn" data-crm="pdf">${ic('download')}Synthèse PDF</button><button class="cbtn cbtn--primary" data-crm="install">${ic('send')}Préparer pour l’installation</button></div></div>
  <div class="crm__grid">
    <div class="panel"><h3>Accès client</h3>
      <div class="codebox"><b style="${S.crmCodeState === 'revoque' ? 'text-decoration:line-through;opacity:.5' : ''}">${S.crmCode}</b><button class="cbtn" data-crm="copy" data-v="${S.crmCode}">${ic('copy')}Copier</button></div>
      <div class="kv"><span>État</span><b>${S.crmCodeState === 'revoque' ? '<span class="pill pill--warn">Révoqué</span>' : '<span class="pill pill--done">Actif</span>'}</b><span>Expire le</span><b>12 novembre 2026</b><span>Dernier accès</span><b>${esc(S.auth?.at || 'Jamais')}</b></div>
      <div class="crm__btns"><button class="cbtn" data-crm="newcode">${ic('refresh')}Nouveau code</button><button class="cbtn" data-crm="sendlink">${ic('send')}Envoyer</button><button class="cbtn cbtn--danger" data-crm="revoke">${ic('ban')}Révoquer</button></div></div>
    <div class="panel"><h3>Progression</h3><div style="display:flex;gap:14px;align-items:center">${ring(p.pct, 76)}<div class="kv" style="flex:1"><span>Éléments</span><b>${p.done} / ${p.total}</b><span>Fichiers</span><b>${photoCount()}</b><span>Statut</span><b><span class="pill ${ST_LABEL[S.status][1]}">${ST_LABEL[S.status][0]}</span></b></div></div>
      ${missing.length ? `<p class="small" style="color:var(--amber-ink)"><b>Manquant :</b> ${missing.map(m => esc(m.title.replace(/^Votre |^Une |^Un /, ''))).join(', ')}</p>` : `<p class="small" style="color:var(--green-dark)"><b>Rien ne manque</b></p>`}
      ${S.callback ? `<p class="small">Rappel demandé : ${esc(S.callback.toLowerCase())}</p>` : ''}</div>
    <div class="panel"><h3>Documents demandés à la cliente</h3><p class="small muted">Seulement ceux utiles à ce dossier. Les autres n’apparaissent pas dans son espace.</p>
      <div class="stack" style="gap:6px">${DOCS.map(d => `<label class="toggle toggle--light">${esc(shotById(d).title.replace(/^Votre |^Une /, ''))}<input type="checkbox" data-crm="doc" data-v="${d}" ${S.docs.includes(d) ? 'checked' : ''}></label>`).join('')}</div></div>
    <div class="panel"><h3>Demander un élément technique</h3><p class="small muted">Jamais demandé d’office. Seul l’élément choisi apparaît chez la cliente.</p>
      <div class="chips">${SHOTS.filter(s => s.extra).map(s => `<button class="cbtn" data-crm="extra" data-v="${s.id}" ${S.complement.includes(s.id) ? 'disabled' : ''}>${ic('plus')}${esc(s.title.replace(/^Votre |^La |^Le |^Les /, ''))}</button>`).join('')}</div></div>
    <div class="panel"><h3>Liaison avec la fiche CRM</h3>
      <div class="kv"><span>Fiche client</span><b>C-10482, existante</b><span>Études par fiche</span><b>1 seule (clé unique)</b><span>Doublons</span><b><span class="pill pill--done">${ic('check', 2.6)}Aucun</span></b><span>Coordonnées</span><b>Lues depuis la fiche</b><span>Fichiers</span><b>dossier-docs (privé)</b></div></div>
  </div>
  <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>Photos et documents</h3><span class="small muted">Classement automatique</span></div>
    <div class="cat-tabs">${CRM_CATS.map(([c, id]) => { const n = (id === 'extra' ? SHOTS.filter(s => s.extra) : SHOTS.filter(s => s.step === id)).reduce((k, s) => k + (S.shots[s.id]?.photos?.length || 0), 0); return `<button aria-pressed="${c === catName}" data-crm="cat" data-v="${esc(c)}">${esc(c)}<em>${n}</em></button>`; }).join('')}</div>
    <div class="photos">${cells || '<p class="muted small">Rien dans cette catégorie.</p>'}</div></div>
  <div class="panel"><h3>Journal</h3><div class="log">${S.log.slice(0, 12).map(l => `<div><time>${esc(l[0])}</time><span>${esc(l[1])}</span></div>`).join('')}</div></div>`;
}
function crmModal(html) { const m = document.createElement('div'); m.className = 'crm-modal'; m.id = 'crm-modal'; m.innerHTML = `<div class="panel">${html}</div>`; m.addEventListener('click', e => { if (e.target === m) m.remove(); }); document.body.appendChild(m); }
function crmFlash(msg) { const t = document.createElement('div'); t.className = 'toast'; t.style.cssText = 'position:fixed;left:auto;right:24px;bottom:24px;max-width:380px'; t.innerHTML = ic('check', 2.4) + `<span>${esc(msg)}</span>`; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function requestShot(id, msg) {
  if (!S.complement.includes(id)) S.complement.push(id);
  S.complementMsg = msg; S.status = 'complement';
  logEv(`Photo demandée à Martine : ${shotById(id).title}`); logEv('Notification envoyée à Martine (e-mail)');
  save(); document.getElementById('crm-modal')?.remove(); render();
  crmFlash('Demande envoyée. Passez en vue Client pour la voir chez Martine.');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-crm]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const a = el.dataset.crm, v = el.dataset.v;
  switch (a) {
    case 'sel': S.crmSel = v; save(); return render();
    case 'cat': S.crmCat = v; save(); return render();
    case 'ok': S.shots[v].crm = 'ok'; logEv(`Photo validée : ${shotById(v).title}`); save(); render(); return crmFlash('Photo validée.');
    case 'redo': return crmModal(`<h3 style="font-size:17px;text-transform:none;letter-spacing:0;color:var(--navy)">Redemander cette photo</h3><p class="small muted">${esc(shotById(v).title)}. Seul cet élément apparaîtra chez la cliente.</p><textarea class="textarea" id="redo-msg" style="min-height:80px">Pouvez-vous la reprendre d’un peu plus loin ?</textarea><div class="crm__btns" style="justify-content:flex-end"><button class="cbtn" onclick="this.closest('.crm-modal').remove()">Annuler</button><button class="cbtn cbtn--primary" data-crm="redoOk" data-v="${v}">${ic('send')}Envoyer la demande</button></div>`);
    case 'redoOk': return requestShot(v, document.getElementById('redo-msg').value);
    case 'extra': return requestShot(v, 'Une photo de plus pour finaliser votre étude.');
    case 'copy': try { navigator.clipboard.writeText(v).catch(() => {}); } catch {} logEv('Code copié par Sarah M.'); save(); render(); return crmFlash('Code copié.');
    case 'newcode': { const al = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; const r = () => Array.from(crypto.getRandomValues(new Uint32Array(4)), x => al[x % al.length]).join(''); S.crmCode = `AEH-${r()}-${r()}`; S.crmCodeState = 'actif'; logEv('Nouveau code généré, l’ancien est révoqué'); save(); render(); return crmFlash('Nouveau code généré.'); }
    case 'revoke': S.crmCodeState = 'revoque'; logEv('Code d’accès révoqué'); save(); render(); return crmFlash('Code révoqué.');
    case 'sendlink': logEv('Invitation renvoyée par e-mail (simulation)'); save(); render(); return crmFlash('Invitation envoyée (simulation).');
    case 'pdf': return crmModal(`<h3 style="font-size:17px;text-transform:none;letter-spacing:0;color:var(--navy)">Synthèse technique PDF</h3><p class="small muted">Fiche projet, photos classées, éléments manquants et leurs raisons, journal. Lien de téléchargement valable 15 minutes.</p><div class="crm__btns" style="justify-content:flex-end"><button class="cbtn" onclick="this.closest('.crm-modal').remove()">Fermer</button></div>`);
    case 'install': S.status = 'termine'; logEv('Dossier préparé pour l’équipe d’installation'); save(); render(); return crmFlash('Étude terminée et transmise à l’installation.');
  }
});
document.addEventListener('change', e => {
  const c = e.target.dataset?.crm;
  if (c === 'status') { S.status = e.target.value; if (S.status !== 'complement') S.complement = []; logEv(`Statut : ${STATUSES.find(s => s[0] === S.status)[1]}`); save(); render(); }
  if (c === 'doc') { const v = e.target.dataset.v; S.docs = e.target.checked ? [...new Set([...S.docs, v])] : S.docs.filter(x => x !== v); S.docs.sort((x, y) => DOCS.indexOf(x) - DOCS.indexOf(y)); logEv(`${shotById(v).title} : ${e.target.checked ? 'demandé' : 'retiré'}`); save(); render(); }
});

function fitViewport() {
  const vv = window.visualViewport;
  const set = () => {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vvh', h + 'px');
    document.documentElement.style.setProperty('--vvt', (vv ? vv.offsetTop : 0) + 'px');
  };
  set();
  (vv || window).addEventListener('resize', set);
  vv?.addEventListener('scroll', set);
  window.addEventListener('orientationchange', () => setTimeout(set, 250));
  // Le champ actif reste visible au-dessus du clavier
  document.addEventListener('focusin', e => { if (e.target.matches('input, textarea')) setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 300); });
}
fitViewport();
async function boot() {
  await IDB.open();
  const all = await IDB.all();
  Object.entries(all).forEach(([k, v]) => { if (k.startsWith('ph-')) CACHE[k] = v; });
  Object.values(S.shots).forEach(r => (r.photos || []).forEach(p => { if (p.key && CACHE[p.key]) p.src = CACHE[p.key]; }));
  const pend = all.pending;
  if (pend && S.auth && S.mode === 'client') {
    // L'onglet a été fermé pendant un envoi : on reprend là où il s'était arrêté.
    S.screen = 'saved'; S.params = { id: pend.shot }; PENDING = { ...pend, state: 'uploading' };
    render(); toast('Reprise de l’envoi de votre photo…'); startUpload(true); return;
  }
  if (PENDING === null && S.screen === 'saved') { S.screen = 'shot'; }
  if (S.auth && S.mode === 'client' && !['accueil', 'code', 'recevoir', 'otp', 'expired'].includes(S.screen)) {
    S.hist = []; S.screen = S.status === 'a_completer' ? 'hub' : 'suivi'; S.params = {};
    render(); const p = progress(); if (p.done) toast(`Bon retour Martine. Vos ${photoCount()} photos sont bien là.`);
    return;
  }
  render();
}
boot();
</script>
